<!DOCTYPE html>
<html>
<head>
  <title>Addictive Hill Game</title>
  <style>
    body { margin:0; overflow:hidden; background:#0f172a; }
    canvas { display:block; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// GAME
let gravity = 0.5;
let baseSpeed = 3;
let speed = baseSpeed;

let score = 0;
let coins = 0;
let combo = 1;

let obstacles = [];

// CAR
let car = {
  x: 200,
  y: canvas.height - 150,
  width: 60,
  height: 30,
  dy: 0
};

// SPAWN OBSTACLES
function spawnObstacle(){
  if(obstacles.length < 6){
    obstacles.push({
      x: canvas.width,
      y: canvas.height - 120,
      w: 30,
      h: 40
    });
  }
}

// UPDATE
function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background
  ctx.fillStyle="#0f172a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // gravity
  car.dy += gravity;
  car.y += car.dy;

  if(car.y > canvas.height - 150){
    car.y = canvas.height - 150;
    car.dy = 0;
  }

  // move obstacles
  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x > -50);

  // collision + near miss
  obstacles.forEach(o => {

    let hit = car.x < o.x + o.w &&
              car.x + car.width > o.x &&
              car.y < o.y + o.h &&
              car.y + car.height > o.y;

    // COLLISION
    if(hit){
      shake();
      alert("Game Over 😢 Score: " + Math.floor(score));
      location.reload();
    }

    // NEAR MISS 🔥
    if(Math.abs(car.x - o.x) < 25 && !hit){
      coins += 2;
      combo += 0.2;
      score += 20 * combo;
    }
  });

  // SCORE SYSTEM
  combo += 0.001;
  score += combo;

  // RANDOM SPEED BOOST ⚡
  if(Math.random() < 0.005){
    speed += 3;
    shake();
    setTimeout(()=> speed = baseSpeed, 2000);
  }

  // DRAW CAR
  ctx.fillStyle="red";
  ctx.fillRect(car.x, car.y, car.width, car.height);

  // DRAW OBSTACLES
  ctx.fillStyle="gray";
  obstacles.forEach(o=>{
    ctx.fillRect(o.x, o.y, o.w, o.h);
  });

  // UI
  ctx.fillStyle="white";
  ctx.fillText("Score: "+Math.floor(score),20,30);
  ctx.fillText("Coins: "+coins,20,50);
  ctx.fillText("Combo: "+combo.toFixed(1),20,70);

  requestAnimationFrame(update);
}

// SHAKE EFFECT 💥
function shake(){
  canvas.style.transform = "translate(5px,5px)";
  setTimeout(()=>{
    canvas.style.transform = "translate(0,0)";
  },100);
}

// CONTROLS
document.addEventListener("keydown", e=>{
  if(e.code==="Space"){
    car.dy = -10;
  }
});

// SPAWN
setInterval(spawnObstacle,1500);

// START
update();
</script>

</body>
</html>
