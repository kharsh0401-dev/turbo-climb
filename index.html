<!DOCTYPE html>
<html>
<head>
  <title>Hill Game Smooth</title>
  <style>
    body { margin:0; overflow:hidden; background:#1e293b; }
    canvas { display:block; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Game variables
let gravity = 0.6;
let speed = 4;
let coins = 0;

let car = {
  x: canvas.width / 4,
  y: canvas.height - 150,
  width: 60,
  height: 30,
  dy: 0,
  jumpPower: -12
};

let coinArray = [];

// Spawn coin (controlled)
function spawnCoin() {
  if (coinArray.length < 15) { // LIMIT FIX 🔥
    coinArray.push({
      x: canvas.width,
      y: Math.random() * 200 + 100,
      r: 10
    });
  }
}

// Draw car
function drawCar() {
  ctx.fillStyle = "red";
  ctx.fillRect(car.x, car.y, car.width, car.height);

  // wheels
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(car.x+10, car.y+30, 8, 0, Math.PI*2);
  ctx.arc(car.x+50, car.y+30, 8, 0, Math.PI*2);
  ctx.fill();
}

// Draw coins
function drawCoins() {
  ctx.fillStyle = "gold";
  coinArray.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.fill();
  });
}

// Update game
function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Background
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Gravity
  car.dy += gravity;
  car.y += car.dy;

  if (car.y > canvas.height - 150) {
    car.y = canvas.height - 150;
    car.dy = 0;
  }

  // Move coins
  coinArray.forEach(c => c.x -= speed);

  // REMOVE off-screen coins (MAIN FREEZE FIX 🔥)
  coinArray = coinArray.filter(c => c.x > -50);

  // Collect coins
  coinArray.forEach((c, i) => {
    if (Math.abs(car.x - c.x) < 40 && Math.abs(car.y - c.y) < 40) {
      coins++;
      coinArray.splice(i, 1);
    }
  });

  drawCar();
  drawCoins();

  // UI
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Coins: " + coins, 20, 40);

  requestAnimationFrame(update); // SINGLE LOOP ✅
}

// Controls
document.addEventListener("keydown", e => {
  if (e.code === "Space") {
    car.dy = car.jumpPower;
  }
});

// Controlled spawn (NO OVERLOAD)
setInterval(spawnCoin, 1200);

// Start
update();
</script>

</body>
</html>
